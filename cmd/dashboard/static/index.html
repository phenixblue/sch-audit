<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>sch-audit</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e2e5ea;
    --text: #1c2333;
    --muted: #6b7280;
    --accent: #3654e0;
    --scheduled: #1a9c5c;
    --scheduled-bg: #e7f7ee;
    --failed: #c0362c;
    --failed-bg: #fbeceb;
    --preempted: #b4670a;
    --preempted-bg: #fbf0e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 20px 28px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 700; }
  header h1 span { color: var(--muted); font-weight: 400; }
  .meta { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 12px; }
  button {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 12px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  main { padding: 24px 28px 60px; max-width: 1280px; margin: 0 auto; }
  #error-banner {
    display: none;
    background: var(--failed-bg);
    color: var(--failed);
    border: 1px solid var(--failed);
    border-radius: 8px;
    padding: 10px 16px;
    margin-bottom: 20px;
    font-size: 13px;
  }
  .cards {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 14px;
    margin-bottom: 24px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .card .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .card .value { font-size: 26px; font-weight: 700; margin-top: 6px; }
  .card.scheduled .value { color: var(--scheduled); }
  .card.failed .value { color: var(--failed); }
  .card.preempted .value { color: var(--preempted); }

  .panels {
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 16px;
    margin-bottom: 24px;
    align-items: stretch;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
  }
  .panel h2 { margin: 0 0 14px; font-size: 14px; font-weight: 600; }
  .panel .empty { color: var(--muted); font-size: 13px; padding: 12px 0; }

  /* Capped height, not width: nodes are rows now, so a cluster with many
     nodes grows this list downward - scroll vertically within the panel
     rather than stretching the whole page or overflowing sideways. */
  #heatmap { max-height: 360px; overflow: auto; }
  #heatmap-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  #heatmap-table th, #heatmap-table td {
    padding: 6px 8px;
    text-align: center;
    border: 1px solid var(--border);
    white-space: nowrap;
  }
  #heatmap-table th.row-label, #heatmap-table td.row-label { text-align: left; font-weight: 600; }
  #heatmap-table td.cell { color: var(--text); font-weight: 600; }
  #heatmap-table thead th { position: sticky; top: 0; background: var(--panel); }

  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bar-row .name { width: 130px; flex-shrink: 0; font-size: 12px; color: var(--muted); text-align: right; }
  .bar-track { flex: 1; background: var(--bg); border-radius: 4px; overflow: hidden; height: 18px; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .bar-row .val { width: 70px; flex-shrink: 0; font-size: 12px; color: var(--text); font-weight: 600; }

  .filters { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .filters select, .filters input {
    font: inherit;
    padding: 6px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--panel);
  }
  .filters input[type="search"] { flex: 1; min-width: 180px; }

  table.decisions { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.decisions th {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 2px solid var(--border);
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .03em;
  }
  table.decisions td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.decisions tbody tr:hover { background: #fafbfc; }
  .badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
  }
  .badge.scheduled { color: var(--scheduled); background: var(--scheduled-bg); }
  .badge.failedscheduling { color: var(--failed); background: var(--failed-bg); }
  .badge.preempted { color: var(--preempted); background: var(--preempted-bg); }
  .row-toggle { cursor: pointer; color: var(--accent); font-size: 12px; user-select: none; }
  .history-row td { background: #fbfbfd; padding: 4px 10px 12px 30px; }
  .history-list { list-style: none; margin: 6px 0 0; padding: 0; font-size: 12px; }
  .history-list li { padding: 3px 0; color: var(--muted); }
  .history-list li b { color: var(--text); }
  .panel-table { max-height: 520px; overflow: auto; }
  @media (max-width: 900px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .panels { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>sch-audit <span>scheduling decision dashboard</span></h1>
  <div class="meta">
    <span id="last-updated">loading…</span>
    <button id="refresh-btn">Refresh</button>
  </div>
</header>

<main>
  <div id="error-banner"></div>

  <section class="cards" id="cards"></section>

  <section class="panels">
    <div class="panel">
      <h2>Node placement by scheduler</h2>
      <div id="heatmap"></div>
    </div>
    <div class="panel">
      <h2>Avg. scheduling latency by scheduler (ms)</h2>
      <div id="latency-chart"></div>
    </div>
  </section>

  <section class="panel">
    <h2>Recent decisions</h2>
    <div class="filters">
      <select id="filter-outcome">
        <option value="">All outcomes</option>
        <option value="Scheduled">Scheduled</option>
        <option value="FailedScheduling">FailedScheduling</option>
        <option value="Preempted">Preempted</option>
      </select>
      <select id="filter-scheduler">
        <option value="">All schedulers</option>
      </select>
      <input type="search" id="filter-search" placeholder="Search pod, namespace, or node…" />
    </div>
    <div class="panel-table">
      <table class="decisions">
        <thead>
          <tr>
            <th></th>
            <th>Pod</th>
            <th>Namespace</th>
            <th>Scheduler</th>
            <th>Node</th>
            <th>Volume driver</th>
            <th>Outcome</th>
            <th>Latency (ms)</th>
            <th>Age</th>
          </tr>
        </thead>
        <tbody id="decisions-body"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
(function () {
  var decisions = [];
  var expanded = new Set();
  var REFRESH_MS = 15000;

  var el = {
    cards: document.getElementById('cards'),
    heatmap: document.getElementById('heatmap'),
    latency: document.getElementById('latency-chart'),
    body: document.getElementById('decisions-body'),
    lastUpdated: document.getElementById('last-updated'),
    error: document.getElementById('error-banner'),
    refreshBtn: document.getElementById('refresh-btn'),
    filterOutcome: document.getElementById('filter-outcome'),
    filterScheduler: document.getElementById('filter-scheduler'),
    filterSearch: document.getElementById('filter-search'),
  };

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function outcomeOf(d) { return (d.status && d.status.outcome) || ''; }
  function nodeOf(d) { return (d.status && d.status.chosenNode) || ''; }
  function latencyOf(d) { return (d.status && d.status.schedulingLatencyMs) || 0; }
  function schedulerOf(d) { return (d.spec && d.spec.schedulerName) || '(unknown)'; }
  function driverOf(d) { return (d.spec && d.spec.volumeContext && d.spec.volumeContext.driverType) || '—'; }
  function transitionsOf(d) { return (d.status && d.status.transitions) || []; }

  function formatAge(ts) {
    if (!ts) return '—';
    var ms = Date.now() - new Date(ts).getTime();
    if (ms < 0) ms = 0;
    var s = Math.floor(ms / 1000);
    if (s < 60) return s + 's';
    var m = Math.floor(s / 60);
    if (m < 60) return m + 'm';
    var h = Math.floor(m / 60);
    if (h < 48) return h + 'h';
    var days = Math.floor(h / 24);
    return days + 'd';
  }

  function renderStats(list) {
    var total = list.length;
    var byOutcome = { Scheduled: 0, FailedScheduling: 0, Preempted: 0 };
    var latencySum = 0, latencyCount = 0;
    list.forEach(function (d) {
      var o = outcomeOf(d);
      if (byOutcome[o] !== undefined) byOutcome[o]++;
      var lat = latencyOf(d);
      if (o === 'Scheduled' && lat > 0) { latencySum += lat; latencyCount++; }
    });
    var avgLatency = latencyCount ? Math.round(latencySum / latencyCount) : 0;

    var cards = [
      { label: 'Total decisions', value: total, cls: '' },
      { label: 'Scheduled', value: byOutcome.Scheduled, cls: 'scheduled' },
      { label: 'Failed scheduling', value: byOutcome.FailedScheduling, cls: 'failed' },
      { label: 'Preempted', value: byOutcome.Preempted, cls: 'preempted' },
      { label: 'Avg. latency (ms)', value: avgLatency, cls: '' },
    ];
    el.cards.innerHTML = cards.map(function (c) {
      return '<div class="card ' + c.cls + '"><div class="label">' + c.label + '</div>' +
        '<div class="value">' + c.value + '</div></div>';
    }).join('');
  }

  function renderHeatmap(list) {
    var counts = {}; // scheduler -> node -> count
    var nodes = {};
    var schedulers = {};
    list.forEach(function (d) {
      if (outcomeOf(d) !== 'Scheduled') return;
      var s = schedulerOf(d), n = nodeOf(d) || '(none)';
      schedulers[s] = true; nodes[n] = true;
      counts[s] = counts[s] || {};
      counts[s][n] = (counts[s][n] || 0) + 1;
    });
    var schedulerList = Object.keys(schedulers).sort();
    var nodeList = Object.keys(nodes).sort();

    if (!schedulerList.length) {
      el.heatmap.innerHTML = '<div class="empty">No Scheduled decisions yet.</div>';
      return;
    }

    var max = 1;
    schedulerList.forEach(function (s) { nodeList.forEach(function (n) {
      max = Math.max(max, (counts[s] && counts[s][n]) || 0);
    }); });

    // Nodes as rows, schedulers as columns: a cluster typically has a
    // handful of schedulers but can have dozens+ of nodes, so this keeps
    // the table narrow (fits without horizontal scrolling) and lets a long
    // node list scroll vertically instead - the more natural direction for
    // a growing list, and the wrapper below caps how tall it can get.
    var html = '<table id="heatmap-table"><thead><tr><th class="row-label">Node \\ Scheduler</th>';
    schedulerList.forEach(function (s) { html += '<th>' + escapeHtml(s) + '</th>'; });
    html += '</tr></thead><tbody>';
    nodeList.forEach(function (n) {
      html += '<tr><td class="row-label">' + escapeHtml(n) + '</td>';
      schedulerList.forEach(function (s) {
        var v = (counts[s] && counts[s][n]) || 0;
        var alpha = v ? (0.15 + 0.65 * (v / max)) : 0;
        var style = v ? ('background: rgba(54,84,224,' + alpha.toFixed(2) + ');') : '';
        html += '<td class="cell" style="' + style + '">' + (v || '') + '</td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table>';
    el.heatmap.innerHTML = html;
  }

  function renderLatencyChart(list) {
    var sums = {}, counts = {};
    list.forEach(function (d) {
      if (outcomeOf(d) !== 'Scheduled') return;
      var lat = latencyOf(d);
      if (lat <= 0) return;
      var s = schedulerOf(d);
      sums[s] = (sums[s] || 0) + lat;
      counts[s] = (counts[s] || 0) + 1;
    });
    var rows = Object.keys(sums).map(function (s) {
      return { name: s, avg: Math.round(sums[s] / counts[s]) };
    }).sort(function (a, b) { return b.avg - a.avg; });

    if (!rows.length) {
      el.latency.innerHTML = '<div class="empty">No latency data yet.</div>';
      return;
    }

    var max = Math.max.apply(null, rows.map(function (r) { return r.avg; })) || 1;
    el.latency.innerHTML = rows.map(function (r) {
      var pct = Math.max(4, Math.round((r.avg / max) * 100));
      return '<div class="bar-row"><div class="name">' + escapeHtml(r.name) + '</div>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%"></div></div>' +
        '<div class="val">' + r.avg + ' ms</div></div>';
    }).join('');
  }

  function populateSchedulerFilter(list) {
    var current = el.filterScheduler.value;
    var schedulers = Array.from(new Set(list.map(schedulerOf))).sort();
    el.filterScheduler.innerHTML = '<option value="">All schedulers</option>' +
      schedulers.map(function (s) { return '<option value="' + escapeHtml(s) + '">' + escapeHtml(s) + '</option>'; }).join('');
    if (schedulers.indexOf(current) !== -1) el.filterScheduler.value = current;
  }

  function matchesFilters(d) {
    var outcome = el.filterOutcome.value;
    var scheduler = el.filterScheduler.value;
    var search = el.filterSearch.value.trim().toLowerCase();
    if (outcome && outcomeOf(d) !== outcome) return false;
    if (scheduler && schedulerOf(d) !== scheduler) return false;
    if (search) {
      var hay = [
        d.spec && d.spec.podName, d.spec && d.spec.podNamespace, nodeOf(d),
      ].join(' ').toLowerCase();
      if (hay.indexOf(search) === -1) return false;
    }
    return true;
  }

  function renderTable(list) {
    var filtered = list.filter(matchesFilters).sort(function (a, b) {
      var ta = (a.status && a.status.decisionTimestamp) || a.metadata.creationTimestamp || '';
      var tb = (b.status && b.status.decisionTimestamp) || b.metadata.creationTimestamp || '';
      return tb.localeCompare(ta);
    });

    if (!filtered.length) {
      el.body.innerHTML = '<tr><td colspan="9" style="color:var(--muted); padding:20px 10px;">No decisions match the current filters.</td></tr>';
      return;
    }

    el.body.innerHTML = filtered.map(function (d) {
      var name = d.metadata.name;
      var outcome = outcomeOf(d);
      var badgeClass = outcome.toLowerCase();
      var transitions = transitionsOf(d);
      var toggle = transitions.length > 1
        ? '<span class="row-toggle" data-name="' + escapeHtml(name) + '">' +
          (expanded.has(name) ? '▾' : '▸') + ' ' + transitions.length + '</span>'
        : '';
      var rows = '<tr>' +
        '<td>' + toggle + '</td>' +
        '<td>' + escapeHtml(d.spec.podName) + '</td>' +
        '<td>' + escapeHtml(d.spec.podNamespace) + '</td>' +
        '<td>' + escapeHtml(schedulerOf(d)) + '</td>' +
        '<td>' + escapeHtml(nodeOf(d) || '—') + '</td>' +
        '<td>' + escapeHtml(driverOf(d)) + '</td>' +
        '<td><span class="badge ' + badgeClass + '">' + escapeHtml(outcome) + '</span></td>' +
        '<td>' + (latencyOf(d) || '—') + '</td>' +
        '<td>' + formatAge((d.status && d.status.decisionTimestamp) || d.metadata.creationTimestamp) + '</td>' +
        '</tr>';
      if (expanded.has(name) && transitions.length) {
        rows += '<tr class="history-row"><td colspan="9"><ul class="history-list">' +
          transitions.map(function (t) {
            return '<li><b>' + escapeHtml(t.outcome) + '</b> at ' + escapeHtml(t.decisionTimestamp) +
              (t.chosenNode ? ' → ' + escapeHtml(t.chosenNode) : '') +
              (t.reasonSummary ? ' — ' + escapeHtml(t.reasonSummary) : '') + '</li>';
          }).join('') + '</ul></td></tr>';
      }
      return rows;
    }).join('');

    Array.prototype.forEach.call(el.body.querySelectorAll('.row-toggle'), function (node) {
      node.addEventListener('click', function () {
        var name = node.getAttribute('data-name');
        if (expanded.has(name)) expanded.delete(name); else expanded.add(name);
        renderTable(decisions);
      });
    });
  }

  function renderAll() {
    renderStats(decisions);
    renderHeatmap(decisions);
    renderLatencyChart(decisions);
    populateSchedulerFilter(decisions);
    renderTable(decisions);
  }

  function showError(msg) {
    el.error.textContent = msg;
    el.error.style.display = 'block';
  }
  function clearError() {
    el.error.style.display = 'none';
  }

  function load() {
    fetch('api/decisions')
      .then(function (r) {
        if (!r.ok) throw new Error('request failed: ' + r.status);
        return r.json();
      })
      .then(function (data) {
        decisions = data || [];
        clearError();
        el.lastUpdated.textContent = 'updated ' + new Date().toLocaleTimeString();
        renderAll();
      })
      .catch(function (err) {
        showError('Failed to load decisions: ' + err.message);
      });
  }

  el.refreshBtn.addEventListener('click', load);
  el.filterOutcome.addEventListener('change', function () { renderTable(decisions); });
  el.filterScheduler.addEventListener('change', function () { renderTable(decisions); });
  el.filterSearch.addEventListener('input', function () { renderTable(decisions); });

  load();
  setInterval(load, REFRESH_MS);
})();
</script>
</body>
</html>

apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: system
  labels:
    control-plane: dashboard
    app.kubernetes.io/name: sch-audit
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: dashboard
      app.kubernetes.io/name: sch-audit
  replicas: 1
  template:
    metadata:
      labels:
        control-plane: dashboard
        app.kubernetes.io/name: sch-audit
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /dashboard
        args:
          - --addr=:8080
        image: controller:latest
        name: dashboard
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 32Mi
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard
  namespace: system
  labels:
    control-plane: dashboard
    app.kubernetes.io/name: sch-audit
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    control-plane: dashboard
    app.kubernetes.io/name: sch-audit
  ports:
  - name: http
    port: 8080
    targetPort: http

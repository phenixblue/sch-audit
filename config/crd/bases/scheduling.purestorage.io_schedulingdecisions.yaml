---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: schedulingdecisions.scheduling.purestorage.io
spec:
  group: scheduling.purestorage.io
  names:
    kind: SchedulingDecision
    listKind: SchedulingDecisionList
    plural: schedulingdecisions
    shortNames:
    - sdec
    singular: schedulingdecision
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.podName
      name: Pod
      type: string
    - jsonPath: .spec.schedulerName
      name: Scheduler
      type: string
    - jsonPath: .status.chosenNode
      name: Node
      type: string
    - jsonPath: .spec.volumeContext.driverType
      name: VolumeDriver
      type: string
    - jsonPath: .status.outcome
      name: Outcome
      type: string
    - jsonPath: .status.schedulingLatencyMs
      name: LatencyMs
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SchedulingDecision is a durable, queryable record of Kubernetes scheduling
          activity for a single pod. It is cluster-scoped; spec identifies the pod
          and is set once, while status holds the latest observed outcome plus the
          full history of transitions that produced it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec identifies the pod this decision is about.
            properties:
              podName:
                description: podName is the name of the pod this decision is about.
                type: string
              podNamespace:
                description: podNamespace is the namespace of the pod this decision
                  is about.
                type: string
              podUID:
                description: |-
                  podUID is the UID of the pod this decision is about. Used to derive
                  the SchedulingDecision's name, so a given pod maps to at most one
                  SchedulingDecision.
                type: string
              schedulerName:
                description: |-
                  schedulerName is the scheduler acting on this pod (e.g.
                  default-scheduler, stork), taken from the reporting component of the
                  source Event.
                type: string
              volumeContext:
                description: |-
                  volumeContext describes the volume plumbing that influences
                  placement, if the pod references a PVC.
                properties:
                  bindingMode:
                    description: |-
                      bindingMode is the StorageClass's VolumeBindingMode (Immediate or
                      WaitForFirstConsumer).
                    type: string
                  driverType:
                    description: |-
                      driverType is the provisioner mapped to a human-readable driver label
                      (e.g. FADA, PX-CSI, vsphere-csi).
                    type: string
                  pvcName:
                    description: |-
                      pvcName is the name of the PersistentVolumeClaim that influenced
                      placement.
                    type: string
                  storageClass:
                    description: storageClass is the StorageClass backing the PVC.
                    type: string
                  topologyConstraint:
                    description: |-
                      topologyConstraint summarizes any topology restriction that shaped
                      node selection (e.g. an allowedTopologies term or a WaitForFirstConsumer
                      topology key).
                    type: string
                type: object
            required:
            - podName
            - podNamespace
            - podUID
            type: object
          status:
            description: status reports the latest observed outcome and its full history.
            properties:
              chosenNode:
                description: |-
                  chosenNode is the node the pod was bound to as of the most recently
                  observed transition. Empty when that transition isn't Scheduled.
                type: string
              decisionTimestamp:
                description: |-
                  decisionTimestamp is the decisionTimestamp of the most recently
                  observed transition.
                format: date-time
                type: string
              outcome:
                description: outcome is the result of the most recently observed transition.
                enum:
                - Scheduled
                - FailedScheduling
                - Preempted
                type: string
              reasonSummary:
                description: |-
                  reasonSummary is the reasonSummary of the most recently observed
                  transition.
                type: string
              schedulingLatencyMs:
                description: |-
                  schedulingLatencyMs is the schedulingLatencyMs of the most recently
                  observed transition.
                format: int64
                type: integer
              transitions:
                description: |-
                  transitions is the ordered history of every scheduling outcome
                  observed for this pod, oldest first.
                items:
                  description: |-
                    SchedulingTransition records a single observed scheduling outcome for a
                    pod, in the order the reconciler observed it. A retry loop (e.g.
                    FailedScheduling while a PVC binds, followed by Scheduled) or a preemption
                    after an earlier successful schedule both show up as separate entries.
                  properties:
                    candidateNodes:
                      description: |-
                        candidateNodes lists nodes considered during this scheduling attempt.
                        Empty unless cmd/extender is deployed and registered with the
                        scheduler; see CandidateNode's doc comment for what it can and can't
                        populate.
                      items:
                        description: |-
                          CandidateNode captures the fate of a single node considered during a
                          scheduling attempt.

                          name is populated by the optional scheduler-extender-based observer
                          (cmd/extender, registered as an additional entry in a scheduler's
                          KubeSchedulerConfiguration extenders list) if one is deployed and
                          registered - it reports the post-Filter candidate list, but as an
                          Extender it never sees the internal per-plugin scores, so filterResult
                          and score are left empty. Both would require a scheduling-framework
                          plugin compiled into the scheduler binary itself (full Tier 2), which
                          isn't attachable to a scheduler this project doesn't build; see
                          docs/tier2-investigation.md.
                        properties:
                          filterResult:
                            description: |-
                              filterResult is the predicate-failure string reported for this node,
                              if the node was rejected during filtering. Not populated by the
                              extender-based observer, which never rejects nodes (see cmd/extender);
                              would require full Tier 2 (scheduling-framework plugin) capture.
                            type: string
                          name:
                            description: name is the node name.
                            type: string
                          score:
                            description: |-
                              score is the node's score at decision time. Not populated by the
                              extender-based observer - an Extender never sees the scheduler's
                              internal per-plugin scores (see docs/tier2-investigation.md); would
                              require full Tier 2 (scheduling-framework plugin) capture.
                            format: int64
                            type: integer
                        required:
                        - name
                        type: object
                      type: array
                      x-kubernetes-list-type: atomic
                    chosenNode:
                      description: |-
                        chosenNode is the node the pod was bound to. Empty for
                        FailedScheduling outcomes.
                      type: string
                    decisionTimestamp:
                      description: decisionTimestamp is when this transition was observed.
                      format: date-time
                      type: string
                    outcome:
                      description: outcome is the result of this scheduling attempt.
                      enum:
                      - Scheduled
                      - FailedScheduling
                      - Preempted
                      type: string
                    reasonSummary:
                      description: |-
                        reasonSummary is a short human-readable explanation of the outcome,
                        taken from the source Event message (e.g. the predicate-failure
                        string for FailedScheduling).
                      type: string
                    schedulingLatencyMs:
                      description: |-
                        schedulingLatencyMs is the time in milliseconds between pod creation
                        and this transition.
                      format: int64
                      type: integer
                    sourceRef:
                      description: |-
                        sourceRef links this transition back to the Kubernetes objects it was
                        reconstructed from.
                      properties:
                        auditRequestID:
                          description: |-
                            auditRequestID is the audit-id of the API request that performed the
                            bind, if it could be correlated.
                          type: string
                        eventUID:
                          description: |-
                            eventUID is the UID of the Kubernetes Event this transition was
                            derived from, if any.
                          type: string
                      type: object
                  required:
                  - decisionTimestamp
                  - outcome
                  type: object
                type: array
                x-kubernetes-list-type: atomic
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}

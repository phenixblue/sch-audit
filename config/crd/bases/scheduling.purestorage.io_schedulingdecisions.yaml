---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: schedulingdecisions.scheduling.purestorage.io
spec:
  group: scheduling.purestorage.io
  names:
    kind: SchedulingDecision
    listKind: SchedulingDecisionList
    plural: schedulingdecisions
    shortNames:
    - sdec
    singular: schedulingdecision
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.podName
      name: Pod
      type: string
    - jsonPath: .spec.schedulerName
      name: Scheduler
      type: string
    - jsonPath: .spec.chosenNode
      name: Node
      type: string
    - jsonPath: .spec.volumeContext.driverType
      name: VolumeDriver
      type: string
    - jsonPath: .spec.outcome
      name: Outcome
      type: string
    - jsonPath: .spec.schedulingLatencyMs
      name: LatencyMs
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SchedulingDecision is a durable, queryable record of a single Kubernetes
          scheduling decision. It is cluster-scoped and treated as an immutable log
          entry: once created, it is not reconciled or updated in place.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec records the scheduling decision.
            properties:
              candidateNodes:
                description: |-
                  candidateNodes lists nodes considered during scheduling. Populated
                  with the rejected-node/reason pairs available from Tier 1
                  reconstruction; scores are Tier 2 only.
                items:
                  description: |-
                    CandidateNode captures the fate of a single node considered during a
                    scheduling attempt. Score is only populated by Tier 2 (scheduling
                    framework hook) capture; Tier 1 reconstruction from Events cannot see
                    per-node scores for nodes that passed filtering.
                  properties:
                    filterResult:
                      description: |-
                        filterResult is the predicate-failure string reported for this node,
                        if the node was rejected during filtering.
                      type: string
                    name:
                      description: name is the node name.
                      type: string
                    score:
                      description: |-
                        score is the node's score at decision time. Only populated by Tier 2
                        capture.
                      format: int64
                      type: integer
                  required:
                  - name
                  type: object
                type: array
                x-kubernetes-list-type: atomic
              chosenNode:
                description: |-
                  chosenNode is the node the pod was bound to. Empty for
                  FailedScheduling outcomes.
                type: string
              decisionTimestamp:
                description: decisionTimestamp is when the scheduling decision was
                  made.
                format: date-time
                type: string
              outcome:
                description: outcome is the terminal result of the scheduling attempt.
                enum:
                - Scheduled
                - FailedScheduling
                - Preempted
                type: string
              podName:
                description: podName is the name of the pod that was scheduled.
                type: string
              podNamespace:
                description: podNamespace is the namespace of the pod that was scheduled.
                type: string
              podUID:
                description: |-
                  podUID is the UID of the pod that was scheduled. Used as the
                  idempotency key so a given pod bind produces at most one
                  SchedulingDecision.
                type: string
              reasonSummary:
                description: |-
                  reasonSummary is a short human-readable explanation of the outcome,
                  taken from the source Event message (e.g. the predicate-failure
                  string for FailedScheduling).
                type: string
              schedulerName:
                description: |-
                  schedulerName is the scheduler that made this decision (e.g.
                  default-scheduler, stork), taken from the reporting component of the
                  source Event.
                type: string
              schedulingLatencyMs:
                description: |-
                  schedulingLatencyMs is the time in milliseconds between pod creation
                  and this decision.
                format: int64
                type: integer
              sourceRef:
                description: |-
                  sourceRef links this decision back to the Kubernetes objects it was
                  reconstructed from.
                properties:
                  auditRequestID:
                    description: |-
                      auditRequestID is the audit-id of the API request that performed the
                      bind, if it could be correlated.
                    type: string
                  eventUID:
                    description: |-
                      eventUID is the UID of the Kubernetes Event this decision was derived
                      from, if any.
                    type: string
                type: object
              volumeContext:
                description: |-
                  volumeContext describes the volume plumbing that influenced
                  placement, if the pod referenced a PVC.
                properties:
                  bindingMode:
                    description: |-
                      bindingMode is the StorageClass's VolumeBindingMode (Immediate or
                      WaitForFirstConsumer).
                    type: string
                  driverType:
                    description: |-
                      driverType is the provisioner mapped to a human-readable driver label
                      (e.g. FADA, PX-CSI, vsphere-csi).
                    type: string
                  pvcName:
                    description: |-
                      pvcName is the name of the PersistentVolumeClaim that influenced
                      placement.
                    type: string
                  storageClass:
                    description: storageClass is the StorageClass backing the PVC.
                    type: string
                  topologyConstraint:
                    description: |-
                      topologyConstraint summarizes any topology restriction that shaped
                      node selection (e.g. an allowedTopologies term or a WaitForFirstConsumer
                      topology key).
                    type: string
                type: object
            required:
            - decisionTimestamp
            - outcome
            - podName
            - podNamespace
            - podUID
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}

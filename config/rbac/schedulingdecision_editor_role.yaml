# This rule is not used by the project sch-audit itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the scheduling.purestorage.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sch-audit
    app.kubernetes.io/managed-by: kustomize
  name: schedulingdecision-editor-role
rules:
- apiGroups:
  - scheduling.purestorage.io
  resources:
  - schedulingdecisions
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - scheduling.purestorage.io
  resources:
  - schedulingdecisions/status
  verbs:
  - get

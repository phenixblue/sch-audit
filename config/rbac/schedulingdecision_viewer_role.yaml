# This rule is not used by the project sch-audit itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to scheduling.purestorage.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sch-audit
    app.kubernetes.io/managed-by: kustomize
  name: schedulingdecision-viewer-role
rules:
- apiGroups:
  - scheduling.purestorage.io
  resources:
  - schedulingdecisions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - scheduling.purestorage.io
  resources:
  - schedulingdecisions/status
  verbs:
  - get

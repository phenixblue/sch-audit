# This rule is not used by the project sch-audit itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over scheduling.purestorage.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sch-audit
    app.kubernetes.io/managed-by: kustomize
  name: schedulingdecision-admin-role
rules:
- apiGroups:
  - scheduling.purestorage.io
  resources:
  - schedulingdecisions
  verbs:
  - '*'
- apiGroups:
  - scheduling.purestorage.io
  resources:
  - schedulingdecisions/status
  verbs:
  - get

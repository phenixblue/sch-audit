apiVersion: scheduling.purestorage.io/v1alpha1
kind: SchedulingDecision
metadata:
  labels:
    app.kubernetes.io/name: sch-audit
    app.kubernetes.io/managed-by: kustomize
  name: schedulingdecision-sample
spec:
  # spec identifies the pod and its stable context; it's set once by the
  # controller when the first transition is observed and never updated
  # afterward. The controller populates status (outcome, chosenNode,
  # reasonSummary, and the full transitions history) via the status
  # subresource, so it isn't set here.
  podName: example-workload-0
  podNamespace: default
  podUID: 11111111-1111-1111-1111-111111111111
  schedulerName: default-scheduler
  volumeContext:
    pvcName: example-workload-data
    storageClass: fada-block
    driverType: FADA
    bindingMode: WaitForFirstConsumer
